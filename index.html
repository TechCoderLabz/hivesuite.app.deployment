<!doctype html>
<html lang="en">

    <title>HiveSuite — Hive blockchain social, blogs, videos, shorts, polls, snaps & games</title>

    <!-- ============================================================
         SEO + social previews
         The app is a SPA mounted with HashRouter, so every route lives
         under `/#/...`. That means search-engine and LLM crawlers
         effectively only see the document served at `/` — make sure
         this <head> answers "what is HiveSuite?" on its own.
         ============================================================ -->
    <meta name="description" content="HiveSuite is a fast, open social app on the Hive blockchain — read & write blogs, snaps, comments and polls, watch videos and shorts, follow communities, manage your wallet, and play 15+ on-chain arcade games. Free, decentralized, ad-free." />
    <meta name="keywords" content="HiveSuite, Hive blockchain, Hive social, Hive blog app, Hive snaps, Hive videos, Hive shorts, Hive polls, 3Speak, Web3 social, decentralized social, PeakD alternative, Ecency alternative, Hive games, Hive wallet, Hive Keychain" />
    <meta name="author" content="HiveSuite" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://hivesuite.app/" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, Discord, Telegram, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HiveSuite" />
    <meta property="og:title" content="HiveSuite — Hive blockchain social, blogs, videos, shorts, polls & games" />
    <meta property="og:description" content="A fast, open social app on the Hive blockchain. Blogs, snaps, videos, shorts, polls, communities, wallet and 15+ on-chain games — all in one place." />

    <!-- JSON-LD structured data so search engines and AI crawlers can
         parse what HiveSuite is without rendering the React tree.
         Schema.org WebApplication + Organization + WebSite (with a
         SearchAction so engines surface in-app search). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "HiveSuite",
            "url": "https://hivesuite.app/",
            "applicationCategory": "SocialNetworkingApplication",
            "operatingSystem": "Web, iOS, Android",
            "description": "HiveSuite is a fast, open social app on the Hive blockchain — read & write blogs, snaps, comments and polls, watch videos and shorts, follow communities, manage your wallet, and play 15+ on-chain arcade games.",
            "image": "https://hivesuite.app/icon-512.png",
            "browserRequirements": "Requires JavaScript and a modern browser.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "featureList": [
              "Hive blogs feed and post composer",
              "Hive snaps (short posts) with media, polls, and replies",
              "3Speak video uploads, video and shorts feeds",
              "Communities, friends, and curated feeds",
              "Polls creation and voting (hPolls)",
              "Hive wallet — vote, transfer, claim rewards, HP/RC delegation",
              "Witness and proposal governance (PeakD-style)",
              "Custom Hive API node management",
              "15+ on-chain arcade games with leaderboards",
              "Schedule posts, default beneficiaries, default tags",
              "Map of posts (WorldMapPin), location picker",
              "Installable as a Progressive Web App on iOS and Android"
            ]
          },
          {
            "@type": "Organization",
            "name": "HiveSuite",
            "url": "https://hivesuite.app/",
            "logo": "https://hivesuite.app/logo.png"
          },
          {
            "@type": "WebSite",
            "name": "HiveSuite",
            "url": "https://hivesuite.app/",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://hivesuite.app/dashboard/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Browser tab icons — uses the same red logo as the PWA icons.
         Order matters: list logo.png first so browsers pick the
         high-res app logo for the tab; smaller PNGs are fallbacks. -->
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/logo.png" />

    <!-- iOS "Add to Home Screen". Safari ignores `rel="icon"` for
         home-screen bookmarks and looks for `apple-touch-icon`
         specifically. Without these the home-screen tile renders as a
         screenshot of the page — that's the bug this commit fixes. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />

    <!-- When launched from the home-screen tile, run in a chromeless
         "standalone" web-app shell (no Safari address bar / nav). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Status-bar styling in standalone mode. `black-translucent` lets
         the page paint under the status bar — pair with the
         `viewport-fit=cover` viewport above so the full screen is
         actually used. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Short label shown under the home-screen icon. Without this iOS
         derives it from <title>, which is too long. -->
    <meta name="apple-mobile-web-app-title" content="HiveSuite" />
    <!-- Generic equivalents honoured by Android / Chromium PWAs. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="HiveSuite" />

    <!-- Tints the address bar / task-switcher chrome. Matches the
         in-app dark surface so there's no contrast jump on launch. -->
    <meta name="theme-color" content="#0d1118" />

    <!-- PWA manifest — Android Chrome reads this for "Install app", and
         iOS 16.4+ honours `name` / `short_name` / `theme_color` from
         it too. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Hive RPC fetch wrap with auto-failover.

      MUST run before any ESM module loads. `@hiveio/dhive` pulls in
      `cross-fetch`, whose browser ponyfill captures a reference to
      `globalThis.fetch` at module-load time. If our wrap is installed
      via an `import './...interceptor'` at the top of `main.tsx`, ESM
      evaluation order *should* run it first — but in practice this
      races with dhive's UMD bundle on the Blogs / dhive-call screens
      and the wrap gets bypassed. An inline `<script>` here runs
      synchronously before *any* module, so the wrap is the fetch
      cross-fetch sees, full stop.

      Behaviour:
        • Rewrites hardcoded `api.hive.blog` calls (in dhive + kit)
          to whichever node the user picked in Settings.
        • Auto-failover on network errors, CORS errors, HTTP ≥ 400
          (excluding 304). Rotates to the next built-in / custom
          node, persists the new selection in `localStorage` under
          `hsnaps-hive-api-node`, dispatches `hivesuite:node-changed`
          so the Zustand store + Settings UI stay in sync, and
          retries the request on the new node.
        • `images.hive.blog` and `/balance-api/...` paths are passed
          through unchanged.

      The TypeScript interceptor (`src/utils/hiveApiInterceptor.ts`)
      runs the same logic at module load with a re-entry guard, so
      this inline copy and the TS copy never double-wrap; whichever
      runs first wins.
    -->
    <script>
      (function () {
        if (typeof window === 'undefined' || typeof window.fetch !== 'function') return;
        if (window.__hiveApiFetchPatched) return;
        window.__hiveApiFetchPatched = true;

        var SELECTION_KEY = 'hsnaps-hive-api-node';
        var CUSTOM_KEY = 'hsnaps-hive-api-custom-nodes';
        var EVENT_NAME = 'hivesuite:node-changed';
        // Must mirror BUILT_IN_HIVE_NODES in stores/hiveNodeStore.ts.
        // Order here defines the rotation order.
        var BUILT_IN = [
          'https://api.hive.blog',
          'https://api.syncad.com',
          'https://api.deathwing.me',
          'https://hive-api.arcange.eu',
          'https://api.openhive.network',
          'https://rpc.mahdiyari.info',
          'https://hive-api.3speak.tv',
          'https://anyx.io',
          'https://techcoderx.com',
          'https://api.c0ff33a.uk',
          'https://hive.roelandp.nl',
        ];
        var LEGACY_HOST = 'api.hive.blog';
        var PASSTHROUGH = ['/balance-api/'];
        var DEFAULT_NODE = 'https://api.hive.blog';
        var COOLDOWN_MS = 1000;
        var lastRotation = 0;

        function norm(s) {
          s = (s || '').trim().replace(/\/+$/, '');
          if (!s) return '';
          if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
          return s;
        }
        function readCurrent() {
          try { var v = localStorage.getItem(SELECTION_KEY); if (v) { var u = norm(v); if (u) return u; } } catch (e) {}
          return DEFAULT_NODE;
        }
        function writeCurrent(url) {
          try {
            localStorage.setItem(SELECTION_KEY, url);
            window.dispatchEvent(new CustomEvent(EVENT_NAME, { detail: url }));
          } catch (e) {}
        }
        function readCustom() {
          try {
            var raw = localStorage.getItem(CUSTOM_KEY);
            if (!raw) return [];
            var p = JSON.parse(raw);
            if (!Array.isArray(p)) return [];
            var out = [];
            for (var i = 0; i < p.length; i++) {
              var u = norm(p[i]);
              if (u) out.push(u);
            }
            return out;
          } catch (e) { return []; }
        }
        function hostOf(u) { try { return new URL(u).host; } catch (e) { return ''; } }
        function pool() {
          var seen = Object.create(null);
          var out = [];
          for (var i = 0; i < BUILT_IN.length; i++) { var u = BUILT_IN[i]; if (!seen[u]) { seen[u] = 1; out.push(u); } }
          var c = readCustom();
          for (var j = 0; j < c.length; j++) { var v = c[j]; if (!seen[v]) { seen[v] = 1; out.push(v); } }
          return out;
        }
        function allHosts() {
          var s = Object.create(null);
          s[LEGACY_HOST] = 1;
          var p = pool();
          for (var i = 0; i < p.length; i++) { var h = hostOf(p[i]); if (h) s[h] = 1; }
          var ch = hostOf(readCurrent()); if (ch) s[ch] = 1;
          return s;
        }
        function nextNode(failedUrl) {
          var p = pool();
          if (p.length === 0) return null;
          var fh = hostOf(failedUrl);
          var idx = -1;
          for (var i = 0; i < p.length; i++) if (hostOf(p[i]) === fh) { idx = i; break; }
          if (idx === -1) return p[0];
          for (var k = 1; k < p.length; k++) {
            var cand = p[(idx + k) % p.length];
            if (hostOf(cand) !== fh) return cand;
          }
          return null;
        }
        function rotate(failedUrl) {
          var cur = readCurrent();
          var curH = hostOf(cur);
          var fH = hostOf(failedUrl);
          var now = Date.now();
          if (now - lastRotation < COOLDOWN_MS) return cur;
          if (fH && fH !== curH) return cur;
          var n = nextNode(fH ? failedUrl : cur);
          if (!n || hostOf(n) === curH) return cur;
          lastRotation = now;
          writeCurrent(n);
          return n;
        }
        function isPass(p) {
          for (var i = 0; i < PASSTHROUGH.length; i++) if (p.pathname.indexOf(PASSTHROUGH[i]) === 0) return true;
          return false;
        }
        function rewriteLegacy(u) {
          try {
            var p = new URL(u);
            if (p.host !== LEGACY_HOST) return u;
            if (isPass(p)) return u;
            var t = new URL(readCurrent());
            p.protocol = t.protocol; p.host = t.host;
            return p.toString();
          } catch (e) { return u; }
        }
        function swap(u, nodeUrl) {
          try {
            var p = new URL(u);
            var t = new URL(nodeUrl);
            p.protocol = t.protocol; p.host = t.host;
            return p.toString();
          } catch (e) { return u; }
        }

        var originalFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          return (async function () {
            var origUrl, origReq = null;
            if (typeof input === 'string') origUrl = input;
            else if (input instanceof URL) origUrl = input.toString();
            else if (input && typeof input.url === 'string') { origReq = input; origUrl = input.url; }
            else return originalFetch(input, init);

            var parsed;
            try { parsed = new URL(origUrl); } catch (e) { return originalFetch(input, init); }
            if (isPass(parsed)) return originalFetch(input, init);

            var url = origUrl;
            if (parsed.host === LEGACY_HOST) url = rewriteLegacy(origUrl);

            var hosts = allHosts();
            var isRpc = !!hosts[hostOf(url)];
            function build(u) {
              if (origReq) return [new Request(u, origReq.clone()), init];
              return [u, init];
            }
            if (!isRpc) { var b0 = build(url); return originalFetch(b0[0], b0[1]); }

            var max = Math.max(1, pool().length);
            var i = 0, lastErr = null;
            while (i < max) {
              i++;
              var b = build(url);
              try {
                var resp = await originalFetch(b[0], b[1]);
                if (!resp.ok && resp.status !== 304) {
                  var n = rotate(url);
                  if (!n || hostOf(n) === hostOf(url)) return resp;
                  url = swap(url, n);
                  continue;
                }
                return resp;
              } catch (err) {
                lastErr = err;
                var n2 = rotate(url);
                if (!n2 || hostOf(n2) === hostOf(url)) throw err;
                url = swap(url, n2);
                continue;
              }
            }
            throw lastErr || new Error('Hive RPC: all nodes failed');
          })();
        };
      })();
    </script>

    <!--
      SPA URL restoration. MUST run before the React bundle so
      BrowserRouter sees the right path on first mount.

      Two jobs:
        1. Legacy hash routes (`/#/foo/bar`) published to Hive before we
           moved off HashRouter — rewrite them to real paths
           (`/foo/bar`) so old shared links still land on the right
           page.
        2. spa-github-pages decode — paths encoded by `/404.html` as
           `/?/foo/bar` get unwrapped back into `/foo/bar`.

      Both rewrites use `history.replaceState`, so the navigation is
      not visible to the user and not recorded as a history entry.
    -->
    <script type="text/javascript">
      (function (l) {
        // 1) Legacy hash-route → real path.
        if (l.pathname === '/' && l.hash && l.hash.indexOf('#/') === 0) {
          var hashPath = l.hash.slice(1); // strip leading "#"
          window.history.replaceState(null, '', hashPath + l.search);
        }
        // 2) spa-github-pages decode (set by /404.html).
        if (l.search && l.search.charAt(1) === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, '',
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
