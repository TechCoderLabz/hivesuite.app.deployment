<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bbBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1130" />
      <stop offset="100%" stop-color="#04020a" />
    </linearGradient>
    <radialGradient id="bbBomb" cx="35%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <radialGradient id="bbBlast" cx="50%" cy="50%" r="70%">
      <stop offset="0%"  stop-color="#fde68a" />
      <stop offset="55%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="rgba(239,68,68,0)" />
    </radialGradient>
  </defs>

  <!-- Card background -->
  <rect width="256" height="256" rx="38" fill="url(#bbBg)" />

  <!-- Subtle grid hint -->
  <g stroke="rgba(168,85,247,0.18)" stroke-width="1">
    <line x1="46"  y1="38" x2="46"  y2="218" />
    <line x1="86"  y1="38" x2="86"  y2="218" />
    <line x1="126" y1="38" x2="126" y2="218" />
    <line x1="166" y1="38" x2="166" y2="218" />
    <line x1="206" y1="38" x2="206" y2="218" />
    <line x1="38" y1="78"  x2="218" y2="78" />
    <line x1="38" y1="118" x2="218" y2="118" />
    <line x1="38" y1="158" x2="218" y2="158" />
    <line x1="38" y1="198" x2="218" y2="198" />
  </g>

  <!-- A few soft blocks scattered -->
  <g>
    <rect x="48"  y="80"  width="36" height="36" rx="4" fill="#7c2d12" stroke="#fed7aa" stroke-width="1" />
    <rect x="128" y="40"  width="36" height="36" rx="4" fill="#7c2d12" stroke="#fed7aa" stroke-width="1" />
    <rect x="168" y="160" width="36" height="36" rx="4" fill="#7c2d12" stroke="#fed7aa" stroke-width="1" />
  </g>

  <!-- Pillar (hard wall) -->
  <rect x="48"  y="160" width="36" height="36" rx="4" fill="#475569" stroke="#1e293b" stroke-width="2" />
  <rect x="50"  y="162" width="32" height="5"  fill="#64748b" />
  <rect x="50"  y="162" width="5"  height="32" fill="#64748b" />

  <!-- Blast radius behind the bomb -->
  <circle cx="128" cy="128" r="78" fill="url(#bbBlast)" opacity="0.55" />

  <!-- Bomb -->
  <g>
    <circle cx="128" cy="134" r="32" fill="url(#bbBomb)" />
    <circle cx="116" cy="120" r="8" fill="rgba(255,255,255,0.25)" />
    <!-- Fuse -->
    <path d="M128 102 Q140 88 152 96" stroke="#a16207" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="152" cy="96" r="5" fill="#fbbf24">
      <animate attributeName="r" values="5;6;5" dur="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="152" cy="96" r="8" fill="#fbbf24" opacity="0.45">
      <animate attributeName="r" values="8;11;8" dur="0.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Player peeking from one corner -->
  <g transform="translate(204 196)">
    <rect x="-9" y="-4" width="18" height="14" fill="#0ea5e9" />
    <rect x="-6" y="-12" width="12" height="10" fill="#fde68a" />
    <rect x="-7" y="-14" width="14" height="5"  fill="#1e40af" />
    <rect x="-3" y="-8"  width="2"  height="2"  fill="#0f172a" />
    <rect x=" 1" y="-8"  width="2"  height="2"  fill="#0f172a" />
  </g>
</svg>
