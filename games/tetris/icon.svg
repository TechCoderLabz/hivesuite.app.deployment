<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2440" />
      <stop offset="100%" stop-color="#06080f" />
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect width="256" height="256" rx="38" fill="url(#tBg)" />

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="40"  y1="32" x2="40"  y2="224" />
    <line x1="72"  y1="32" x2="72"  y2="224" />
    <line x1="104" y1="32" x2="104" y2="224" />
    <line x1="136" y1="32" x2="136" y2="224" />
    <line x1="168" y1="32" x2="168" y2="224" />
    <line x1="200" y1="32" x2="200" y2="224" />
    <line x1="20" y1="64"  x2="236" y2="64" />
    <line x1="20" y1="96"  x2="236" y2="96" />
    <line x1="20" y1="128" x2="236" y2="128" />
    <line x1="20" y1="160" x2="236" y2="160" />
    <line x1="20" y1="192" x2="236" y2="192" />
  </g>

  <!-- Pieces. Each tetromino is a 4-cell composition of 32×32 blocks. -->
  <!-- T piece (purple) at top-left -->
  <g>
    <rect x="40"  y="40" width="32" height="32" fill="#a855f7" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
    <rect x="72"  y="40" width="32" height="32" fill="#a855f7" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
    <rect x="104" y="40" width="32" height="32" fill="#a855f7" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
    <rect x="72"  y="72" width="32" height="32" fill="#a855f7" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
  </g>

  <!-- L piece (orange) top-right -->
  <g>
    <rect x="168" y="40" width="32" height="32" fill="#f97316" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
    <rect x="168" y="72" width="32" height="32" fill="#f97316" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
    <rect x="168" y="104" width="32" height="32" fill="#f97316" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
    <rect x="200" y="104" width="32" height="32" fill="#f97316" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
  </g>

  <!-- S piece (green) center -->
  <g>
    <rect x="72"  y="128" width="32" height="32" fill="#22c55e" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
    <rect x="104" y="128" width="32" height="32" fill="#22c55e" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
    <rect x="40"  y="160" width="32" height="32" fill="#22c55e" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
    <rect x="72"  y="160" width="32" height="32" fill="#22c55e" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
  </g>

  <!-- I piece (cyan) bottom horizontal -->
  <g>
    <rect x="104" y="192" width="32" height="32" fill="#22d3ee" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
    <rect x="136" y="192" width="32" height="32" fill="#22d3ee" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
    <rect x="168" y="192" width="32" height="32" fill="#22d3ee" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
    <rect x="200" y="192" width="32" height="32" fill="#22d3ee" stroke="rgba(0,0,0,0.4)" stroke-width="2" />
  </g>

  <!-- Highlights on each block (top + left light edge) -->
  <g fill="rgba(255,255,255,0.32)">
    <!-- T piece -->
    <rect x="40"  y="40"  width="32" height="3" />
    <rect x="40"  y="40"  width="3" height="32" />
    <rect x="72"  y="40"  width="32" height="3" />
    <rect x="104" y="40"  width="32" height="3" />
    <rect x="104" y="40"  width="3" height="32" />
    <rect x="72"  y="72"  width="32" height="3" />
    <!-- L piece -->
    <rect x="168" y="40"  width="32" height="3" />
    <rect x="168" y="40"  width="3" height="64" />
    <rect x="168" y="104" width="3" height="32" />
    <rect x="200" y="104" width="32" height="3" />
    <rect x="200" y="104" width="3" height="32" />
    <!-- S piece -->
    <rect x="72"  y="128" width="32" height="3" />
    <rect x="72"  y="128" width="3" height="32" />
    <rect x="104" y="128" width="32" height="3" />
    <rect x="104" y="128" width="3" height="32" />
    <rect x="40"  y="160" width="32" height="3" />
    <rect x="40"  y="160" width="3" height="32" />
    <rect x="72"  y="160" width="32" height="3" />
    <!-- I piece -->
    <rect x="104" y="192" width="128" height="3" />
    <rect x="104" y="192" width="3" height="32" />
  </g>
</svg>
