<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <!-- Word Finder — three filled crossword cells spelling "WIN"
       on a dark purple field, with a small letter wheel hint
       (faint circle + 4 dots) below. Reads as a word puzzle game
       at a glance. -->
  <defs>
    <linearGradient id="wf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1c4d"/>
      <stop offset="100%" stop-color="#08051a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#wf-bg)"/>

  <!-- Crossword row: W I N -->
  <g>
    <rect x="11" y="14" width="14" height="14" rx="3" fill="#ffffff"/>
    <text x="18" y="25" font-family="system-ui, -apple-system, sans-serif"
          font-weight="800" font-size="11" text-anchor="middle" fill="#2c1545">W</text>
    <rect x="25" y="14" width="14" height="14" rx="3" fill="#a7f3a3"/>
    <text x="32" y="25" font-family="system-ui, -apple-system, sans-serif"
          font-weight="800" font-size="11" text-anchor="middle" fill="#15431a">I</text>
    <rect x="39" y="14" width="14" height="14" rx="3" fill="#ffffff"/>
    <text x="46" y="25" font-family="system-ui, -apple-system, sans-serif"
          font-weight="800" font-size="11" text-anchor="middle" fill="#2c1545">N</text>
    <!-- crossing letter below I -->
    <rect x="25" y="28" width="14" height="14" rx="3" fill="#ffffff"/>
    <text x="32" y="39" font-family="system-ui, -apple-system, sans-serif"
          font-weight="800" font-size="11" text-anchor="middle" fill="#2c1545">N</text>
  </g>

  <!-- Wheel hint at bottom -->
  <circle cx="32" cy="52" r="8" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.7"/>
  <circle cx="32" cy="46" r="2" fill="#fbbf24"/>
  <circle cx="38" cy="52" r="2" fill="#f4ecdc"/>
  <circle cx="32" cy="58" r="2" fill="#f4ecdc"/>
  <circle cx="26" cy="52" r="2" fill="#f4ecdc"/>
</svg>
