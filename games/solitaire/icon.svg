<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
  <defs>
    <linearGradient id="slIconFelt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a2f"/>
      <stop offset="100%" stop-color="#0e2820"/>
    </linearGradient>
    <linearGradient id="slIconBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1c2a64"/>
    </linearGradient>
  </defs>
  <!-- Felt background -->
  <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#slIconFelt)"/>

  <!-- A fan of three cards: face-down, red ace, black king (winning hand vibe) -->
  <!-- Back -->
  <g transform="translate(8 14) rotate(-14)">
    <rect width="20" height="28" rx="3" fill="url(#slIconBack)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <path d="M2 4 L18 24 M2 24 L18 4" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" fill="none"/>
  </g>
  <!-- Red A♥ -->
  <g transform="translate(22 12) rotate(0)">
    <rect width="20" height="28" rx="3" fill="#fafafa" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
    <text x="3" y="9" font-family="system-ui, sans-serif" font-size="7" font-weight="800" fill="#dc2626">A</text>
    <text x="3" y="16" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#dc2626">♥</text>
    <text x="10" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#dc2626" opacity="0.85">♥</text>
  </g>
  <!-- Black K♠ -->
  <g transform="translate(36 14) rotate(14)">
    <rect width="20" height="28" rx="3" fill="#fafafa" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
    <text x="3" y="9" font-family="system-ui, sans-serif" font-size="7" font-weight="800" fill="#111">K</text>
    <text x="3" y="16" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#111">♠</text>
    <text x="10" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111" opacity="0.85">♠</text>
  </g>

  <!-- Foundation hint glow at bottom -->
  <circle cx="32" cy="54" r="3" fill="#facc15" opacity="0.85"/>
</svg>
