<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <defs>
    <linearGradient id="bm-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f1240"/>
      <stop offset="50%" stop-color="#5e3273"/>
      <stop offset="100%" stop-color="#fbb56a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="10" fill="url(#bm-sky)"/>
  <!-- sun -->
  <circle cx="42" cy="36" r="6" fill="#ffd9a0" opacity="0.85"/>
  <!-- bow (left) -->
  <path d="M 14 18 Q 8 32 14 46" stroke="#c2772b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <line x1="14" y1="18" x2="14" y2="46" stroke="#fff8e0" stroke-width="1"/>
  <!-- arrow shaft -->
  <line x1="14" y1="32" x2="38" y2="32" stroke="#3a2818" stroke-width="1.5" stroke-linecap="round"/>
  <!-- arrowhead -->
  <polygon points="38,30 42,32 38,34" fill="#7a7d80"/>
  <!-- fletching -->
  <polygon points="14,32 17,30 19,32 17,34" fill="#cc4040"/>
  <!-- apple (right) -->
  <circle cx="51" cy="44" r="4" fill="#dc3030"/>
  <rect x="50.5" y="39" width="1" height="2" fill="#5a3010"/>
  <ellipse cx="53" cy="40" rx="1.5" ry="0.8" fill="#3a8a3a" transform="rotate(20 53 40)"/>
  <!-- ground -->
  <rect x="0" y="54" width="64" height="10" fill="#0e0a14"/>
</svg>
