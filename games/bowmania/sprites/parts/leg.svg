<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 120" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="pant" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="0.5" stop-color="#4a3320"/>
      <stop offset="1" stop-color="#0a0402"/>
    </linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1808"/>
      <stop offset="0.5" stop-color="#4a2810"/>
      <stop offset="1" stop-color="#0a0402"/>
    </linearGradient>
  </defs>
  <!-- Pant leg — tapered slightly toward the ankle -->
  <path d="M 4 4
           L 26 4
           L 24 96
           Q 24 100 20 100
           L 10 100
           Q 6 100 6 96 Z" fill="url(#pant)"/>
  <!-- Pant shadow on left side -->
  <path d="M 4 4 L 15 4 L 15 100 L 10 100 Q 6 100 6 96 Z" fill="rgba(0,0,0,0.24)"/>
  <!-- Knee crease -->
  <path d="M 6 60 Q 15 64 24 60" stroke="rgba(0,0,0,0.4)" stroke-width="0.8" fill="none"/>
  <!-- Pant cuff -->
  <rect x="6" y="96" width="18" height="6" fill="#1a0e04"/>
  <!-- Boot — extends past the cuff with a heel and toe -->
  <path d="M 5 102
           L 25 102
           L 27 110
           Q 27 116 22 116
           L 8 116
           Q 3 116 3 110 Z" fill="url(#boot)"/>
  <!-- Boot toe -->
  <path d="M 22 116 Q 27 116 27 112 Q 27 116 24 118 L 22 118 Z" fill="#0a0402"/>
  <!-- Boot stitching -->
  <line x1="6" y1="106" x2="24" y2="106" stroke="rgba(255,220,180,0.2)" stroke-width="0.5"/>
  <!-- Boot buckle/strap -->
  <rect x="8" y="108" width="14" height="2" fill="#2a1808"/>
  <rect x="13" y="107" width="4" height="4" fill="#a07820" stroke="#5a3a18" stroke-width="0.4"/>
  <!-- Pant highlight -->
  <path d="M 22 8 Q 24 50 22 90" stroke="rgba(180,140,90,0.18)" stroke-width="1.5" fill="none"/>
</svg>
