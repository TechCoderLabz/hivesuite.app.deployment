<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a4a38"/>
      <stop offset="0.5" stop-color="#a89478"/>
      <stop offset="1" stop-color="#3a2f20"/>
    </linearGradient>
    <radialGradient id="hand" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#e7c4a0"/>
      <stop offset="0.6" stop-color="#b88560"/>
      <stop offset="1" stop-color="#5a3a20"/>
    </radialGradient>
  </defs>
  <!-- Sleeve (upper arm + forearm together) — slightly tapered toward wrist -->
  <path d="M 6 4
           Q 4 4 4 8
           L 8 76
           Q 8 80 12 80
           L 18 80
           Q 22 80 22 76
           L 26 8
           Q 26 4 24 4 Z" fill="url(#sleeve)"/>
  <!-- Sleeve shadow on left side -->
  <path d="M 6 4 Q 4 4 4 8 L 8 76 Q 8 80 12 80 L 15 80 L 15 4 Z" fill="rgba(0,0,0,0.22)"/>
  <!-- Cuff at wrist -->
  <rect x="8" y="76" width="14" height="4" fill="#3a2f20"/>
  <line x1="8" y1="78" x2="22" y2="78" stroke="rgba(255,220,180,0.25)" stroke-width="0.5"/>
  <!-- Bicep highlight -->
  <path d="M 18 10 Q 22 28 20 50" stroke="rgba(255,220,180,0.18)" stroke-width="2" fill="none"/>
  <!-- Hand — slightly cupped, with knuckles -->
  <path d="M 8 80
           Q 6 84 8 92
           Q 10 96 14 96
           L 16 96
           Q 20 96 22 92
           Q 24 84 22 80 Z" fill="url(#hand)"/>
  <!-- Knuckle indents -->
  <path d="M 11 88 Q 13 90 13 92" stroke="rgba(80,40,20,0.4)" stroke-width="0.6" fill="none"/>
  <path d="M 14 88 Q 16 90 16 92" stroke="rgba(80,40,20,0.4)" stroke-width="0.6" fill="none"/>
  <path d="M 17 88 Q 19 90 19 92" stroke="rgba(80,40,20,0.4)" stroke-width="0.6" fill="none"/>
  <!-- Hand highlight -->
  <ellipse cx="13" cy="84" rx="2" ry="2.5" fill="rgba(255,255,255,0.25)"/>
</svg>
