<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 80" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="skin" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f0d2a8"/>
      <stop offset="0.55" stop-color="#d4a578"/>
      <stop offset="1" stop-color="#7a4f30"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1f0a"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080402"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c89878"/>
      <stop offset="1" stop-color="#7a4f30"/>
    </linearGradient>
  </defs>
  <!-- Neck -->
  <path d="M 22 60 Q 22 72 26 78 L 34 78 Q 38 72 38 60 Z" fill="url(#neck)"/>
  <!-- Neck shadow -->
  <ellipse cx="30" cy="62" rx="9" ry="2.5" fill="rgba(0,0,0,0.35)"/>
  <!-- Skull base -->
  <ellipse cx="30" cy="32" rx="22" ry="26" fill="url(#skin)"/>
  <!-- Jaw line shadow -->
  <path d="M 14 38 Q 30 56 46 38 Q 42 50 30 56 Q 18 50 14 38 Z" fill="rgba(0,0,0,0.18)"/>
  <!-- Ear -->
  <path d="M 8 30 Q 4 32 6 38 Q 8 44 12 42 L 12 32 Z" fill="#c89878"/>
  <ellipse cx="9" cy="36" rx="1.5" ry="3" fill="rgba(0,0,0,0.4)"/>
  <!-- Hair (top + sides) -->
  <path d="M 8 28 Q 8 4 30 2 Q 52 4 52 28
           L 52 16 Q 44 8 30 10 Q 16 8 8 16 Z" fill="url(#hair)"/>
  <!-- Hair fringe -->
  <path d="M 12 16 Q 22 14 30 18 Q 38 14 48 16 L 48 22 Q 38 18 30 22 Q 22 18 12 22 Z" fill="#1a0a04"/>
  <!-- Eyebrow -->
  <path d="M 14 28 Q 20 25 26 27" stroke="#1a0a04" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Eye socket shadow -->
  <ellipse cx="20" cy="33" rx="5" ry="3" fill="rgba(80,40,20,0.25)"/>
  <!-- Eye whites -->
  <ellipse cx="20" cy="33" rx="3.5" ry="2.5" fill="#fff8e0"/>
  <!-- Iris -->
  <circle cx="19" cy="33" r="2" fill="#3a2818"/>
  <!-- Pupil -->
  <circle cx="18.5" cy="33" r="1" fill="#000"/>
  <!-- Eye highlight -->
  <circle cx="18" cy="32.5" r="0.5" fill="#fff"/>
  <!-- Nose bridge shadow -->
  <path d="M 25 32 Q 22 42 25 48 Q 24 50 22 50" stroke="rgba(60,30,10,0.4)" stroke-width="1.2" fill="none"/>
  <!-- Nostril shadow -->
  <ellipse cx="22" cy="48" rx="1.5" ry="1" fill="rgba(60,30,10,0.5)"/>
  <!-- Upper lip shadow -->
  <path d="M 18 51 Q 24 53 28 51" stroke="rgba(80,30,20,0.5)" stroke-width="0.8" fill="none"/>
  <!-- Mouth -->
  <path d="M 18 54 Q 24 57 28 54" stroke="#5a2018" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Chin shadow -->
  <path d="M 22 58 Q 28 60 34 58" stroke="rgba(80,40,20,0.3)" stroke-width="1" fill="none"/>
  <!-- Cheek blush -->
  <ellipse cx="14" cy="42" rx="3" ry="2" fill="rgba(220,80,80,0.18)"/>
  <!-- Stubble shadow -->
  <ellipse cx="26" cy="56" rx="10" ry="3" fill="rgba(40,20,10,0.18)"/>
</svg>
