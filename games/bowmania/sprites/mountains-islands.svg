<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="none">
  <defs>
    <linearGradient id="island-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a78"/>
      <stop offset="1" stop-color="#2a1838"/>
    </linearGradient>
    <linearGradient id="island-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2050"/>
      <stop offset="1" stop-color="#181030"/>
    </linearGradient>
    <linearGradient id="island-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e28"/>
      <stop offset="1" stop-color="#080418"/>
    </linearGradient>
  </defs>

  <!-- Sun reflection on the horizon line — soft orange glow -->
  <ellipse cx="600" cy="220" rx="280" ry="14" fill="rgba(255, 180, 120, 0.4)"/>
  <ellipse cx="600" cy="218" rx="160" ry="6" fill="rgba(255, 220, 160, 0.5)"/>

  <!-- Far island chain — small humped silhouettes scattered along the
       horizon. Each is a low rounded shape. -->
  <g fill="url(#island-far)">
    <path d="M 80 220 Q 120 196 160 220 Z"/>
    <path d="M 220 220 Q 270 200 320 220 Z"/>
    <path d="M 380 220 Q 430 198 480 220 Z"/>
    <path d="M 720 220 Q 770 198 820 220 Z"/>
    <path d="M 880 220 Q 930 200 980 220 Z"/>
    <path d="M 1040 220 Q 1090 196 1140 220 Z"/>
  </g>
  <!-- Subtle palm-tree silhouettes on the larger far islands -->
  <g fill="rgba(20, 10, 30, 0.7)">
    <path d="M 270 200 L 271 212 L 273 200 Z M 268 198 Q 266 196 264 198 M 274 198 Q 276 196 278 198 M 269 200 Q 267 197 265 199"/>
    <path d="M 770 198 L 771 210 L 773 198 Z M 768 196 Q 766 194 764 196 M 774 196 Q 776 194 778 196"/>
  </g>

  <!-- Mid range — a couple of bigger islands rising taller, with hints
       of vegetation and a rocky outcrop. -->
  <g fill="url(#island-mid)">
    <path d="M 0 240 Q 30 230 60 234 L 90 220 Q 120 210 160 220 Q 200 232 240 240 L 0 240 Z"/>
    <path d="M 480 240 Q 510 232 540 230 L 580 218 Q 620 208 660 220 Q 700 234 740 240 L 480 240 Z"/>
    <path d="M 880 240 Q 910 234 940 232 L 970 222 Q 1000 212 1040 222 Q 1080 234 1120 240 L 1200 240 L 1200 240 Z"/>
  </g>
  <!-- Mid island palm clusters -->
  <g fill="rgba(10, 6, 24, 0.85)">
    <path d="M 150 222 L 151 232 L 153 222 Z M 148 220 Q 146 218 144 220 M 154 220 Q 156 218 158 220"/>
    <path d="M 620 222 L 621 232 L 623 222 Z M 618 220 Q 616 218 614 220 M 624 220 Q 626 218 628 220"/>
    <path d="M 1010 224 L 1011 234 L 1013 224 Z M 1008 222 Q 1006 220 1004 222 M 1014 222 Q 1016 220 1018 222"/>
  </g>

  <!-- Near range (darkest) — chunky foreground islands -->
  <path d="M 0 270
           L 80 250 L 180 268 L 280 244 L 380 260 L 500 248 L 620 256
           L 750 246 L 870 258 L 1000 244 L 1120 256 L 1200 248
           L 1200 300 L 0 300 Z" fill="url(#island-near)"/>
  <!-- Foreground palm/lighthouse tiny silhouettes -->
  <g fill="rgba(0, 0, 0, 0.8)">
    <!-- Tiny palms -->
    <path d="M 75 252 L 76 262 L 78 252 Z M 73 250 Q 71 248 69 250 M 79 250 Q 81 248 83 250"/>
    <path d="M 275 246 L 276 258 L 278 246 Z M 273 244 Q 271 242 269 244 M 279 244 Q 281 242 283 244"/>
    <path d="M 745 248 L 746 260 L 748 248 Z M 743 246 Q 741 244 739 246 M 749 246 Q 751 244 753 246"/>
    <path d="M 995 246 L 996 258 L 998 246 Z M 993 244 Q 991 242 989 244 M 999 244 Q 1001 242 1003 244"/>
    <!-- A tiny lighthouse silhouette -->
    <rect x="498" y="240" width="3" height="10"/>
    <rect x="497" y="238" width="5" height="2"/>
    <circle cx="499.5" cy="237" r="1"/>
  </g>
</svg>
