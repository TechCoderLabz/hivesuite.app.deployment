<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a3654"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1976ea"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="20" fill="#ffffff" stroke="#d6dbe5" stroke-width="2"/>

  <!-- Dot lattice. -->
  <g fill="#c4cad8">
    <circle cx="28" cy="32" r="2"/>
    <circle cx="48" cy="32" r="2"/>
    <circle cx="68" cy="32" r="2"/>
    <circle cx="88" cy="32" r="2"/>
    <circle cx="108" cy="32" r="2"/>
    <circle cx="28" cy="52" r="2"/>
    <circle cx="48" cy="52" r="2"/>
    <circle cx="68" cy="52" r="2"/>
    <circle cx="88" cy="52" r="2"/>
    <circle cx="108" cy="52" r="2"/>
    <circle cx="28" cy="72" r="2"/>
    <circle cx="48" cy="72" r="2"/>
    <circle cx="68" cy="72" r="2"/>
    <circle cx="88" cy="72" r="2"/>
    <circle cx="108" cy="72" r="2"/>
    <circle cx="28" cy="92" r="2"/>
    <circle cx="48" cy="92" r="2"/>
    <circle cx="68" cy="92" r="2"/>
    <circle cx="88" cy="92" r="2"/>
    <circle cx="108" cy="92" r="2"/>
  </g>

  <!-- Three arrows: a long right, a short down, and a featured blue right (the "tap" target). -->
  <g stroke="#2a3654" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="28" y1="32" x2="88" y2="32" marker-end="url(#ah)"/>
    <line x1="48" y1="52" x2="48" y2="92" marker-end="url(#ah)"/>
  </g>
  <g stroke="#1976ea" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="68" y1="72" x2="108" y2="72" marker-end="url(#ahb)"/>
  </g>
</svg>
