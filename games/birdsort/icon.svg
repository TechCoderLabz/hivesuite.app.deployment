<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Bird Sort icon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9dcff"/>
      <stop offset="55%" stop-color="#4aa2ee"/>
      <stop offset="100%" stop-color="#1d4a8c"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a87a4a"/>
      <stop offset="50%" stop-color="#7a5028"/>
      <stop offset="100%" stop-color="#3a2110"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86d56a"/>
      <stop offset="100%" stop-color="#2f7a2c"/>
    </linearGradient>
    <!-- Per-bird color gradients -->
    <linearGradient id="birdRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="55%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#a01a1a"/>
    </linearGradient>
    <linearGradient id="birdYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde47a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a07a0c"/>
    </linearGradient>
    <linearGradient id="birdBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#79b8ff"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#173d80"/>
    </linearGradient>
  </defs>

  <!-- Rounded sky background -->
  <rect x="0" y="0" width="128" height="128" rx="22" fill="url(#sky)"/>
  <!-- Soft sun glow top-left -->
  <circle cx="22" cy="20" r="40" fill="#ffe2b0" opacity="0.45"/>

  <!-- Branch -->
  <g transform="translate(8 84)">
    <ellipse cx="56" cy="22" rx="56" ry="3" fill="rgba(0,0,0,0.45)"/>
    <rect x="0" y="6" width="112" height="14" rx="7" fill="url(#bark)" stroke="rgba(0,0,0,0.6)" stroke-width="0.8"/>
    <!-- Leaves left -->
    <path d="M -4,12 Q -16,2 -2,-4 Q 10,2 4,12 Z" fill="url(#leaf)" stroke="rgba(0,0,0,0.4)" stroke-width="0.7"/>
    <!-- Leaves right -->
    <path d="M 116,12 Q 128,2 114,-4 Q 102,2 108,12 Z" fill="url(#leaf)" stroke="rgba(0,0,0,0.4)" stroke-width="0.7"/>
  </g>

  <!-- Three birds perched, different species -->
  <g transform="translate(14 48)">
    <use href="#birdShape" fill="url(#birdRed)"/>
  </g>
  <g transform="translate(48 48)">
    <use href="#birdShape" fill="url(#birdYellow)"/>
  </g>
  <g transform="translate(82 48)">
    <use href="#birdShape" fill="url(#birdBlue)"/>
  </g>

  <!-- Reusable bird symbol (positioned at translate origin) -->
  <symbol id="birdShape" overflow="visible">
    <!-- Body -->
    <ellipse cx="16" cy="22" rx="15" ry="11"/>
    <!-- Tail -->
    <polygon points="0,18 8,12 8,28" opacity="0.7"/>
    <!-- Head -->
    <circle cx="26" cy="12" r="9"/>
    <!-- Beak -->
    <polygon points="34,12 41,11 40,16 34,16" fill="#f4a623" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"/>
    <!-- Eye -->
    <circle cx="28" cy="10" r="2.4" fill="#ffffff"/>
    <circle cx="29" cy="10.4" r="1.4" fill="#1a1a1a"/>
    <!-- Wing -->
    <path d="M 9,16 Q 16,12 24,18 Q 16,22 9,20 Z" fill="rgba(0,0,0,0.18)"/>
    <!-- Body outline -->
    <ellipse cx="16" cy="22" rx="15" ry="11" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="0.8"/>
    <circle cx="26" cy="12" r="9" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="0.8"/>
    <!-- Feet -->
    <line x1="11" y1="32" x2="10" y2="38" stroke="#3a2a1a" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="19" y1="32" x2="20" y2="38" stroke="#3a2a1a" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>
</svg>
