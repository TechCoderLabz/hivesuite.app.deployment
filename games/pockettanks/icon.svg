<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ptSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04070f"/>
      <stop offset="55%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#1a1d33"/>
    </linearGradient>
    <linearGradient id="ptDirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2030"/>
      <stop offset="100%" stop-color="#0c0810"/>
    </linearGradient>
    <radialGradient id="ptMoonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#bcc8e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#bcc8e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ptBoom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe28a" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ff8c3c" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ff8c3c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded panel + night sky -->
  <rect width="64" height="64" rx="10" fill="url(#ptSky)"/>

  <!-- Starfield -->
  <g fill="#cdd7ee">
    <circle cx="6" cy="6" r="0.5" opacity="0.85"/>
    <circle cx="14" cy="3" r="0.4" opacity="0.7"/>
    <circle cx="22" cy="8" r="0.35" opacity="0.6"/>
    <circle cx="31" cy="4" r="0.45" opacity="0.8"/>
    <circle cx="38" cy="15" r="0.3" opacity="0.55"/>
    <circle cx="42" cy="5" r="0.4" opacity="0.7"/>
  </g>

  <!-- Moon halo + disc -->
  <circle cx="51" cy="13" r="11" fill="url(#ptMoonGlow)"/>
  <circle cx="51" cy="13" r="4.6" fill="#e5ecff"/>
  <circle cx="53" cy="12" r="3.8" fill="#a6b1cf" opacity="0.32"/>

  <!-- Distant + near mountain silhouettes -->
  <path d="M0 32 Q10 27 18 30 T34 28 T48 32 T64 30 V42 H0 Z" fill="#161c33"/>
  <path d="M0 38 Q14 34 24 37 T44 35 T64 38 V46 H0 Z" fill="#0f1525"/>

  <!-- Playable terrain -->
  <path d="M0 48 Q16 44 32 47 T64 46 V64 H0 Z" fill="url(#ptDirt)"/>
  <path d="M0 48 Q16 44 32 47 T64 46" stroke="rgba(180,200,240,0.22)" stroke-width="0.6" fill="none"/>

  <!-- Big explosion glow at impact site (right) -->
  <circle cx="52" cy="42" r="11" fill="url(#ptBoom)"/>

  <!-- Glowing shell arc -->
  <path d="M14 42 Q30 14 50 41" stroke="#ffd166" stroke-width="1.3" stroke-dasharray="2.5 1.6" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- LEFT TANK — player, blue pennant -->
  <g transform="translate(4 41)">
    <ellipse cx="8" cy="9" rx="9" ry="0.9" fill="rgba(0,0,0,0.55)"/>
    <rect x="-1" y="5" width="18" height="3" rx="1" fill="#08080d"/>
    <circle cx="1" cy="6.5" r="1.2" fill="#15172a"/>
    <circle cx="4.5" cy="6.5" r="1" fill="#15172a"/>
    <circle cx="8" cy="6.5" r="1" fill="#15172a"/>
    <circle cx="11.5" cy="6.5" r="1" fill="#15172a"/>
    <circle cx="16" cy="6.5" r="1.2" fill="#15172a"/>
    <path d="M-1 5 V2 L1 0 H12 L16 3 V5 Z" fill="#2c3540" stroke="#000" stroke-width="0.5"/>
    <path d="M3 0 V-3 L5 -5 H9 L11 -3 V0 Z" fill="#3a4555" stroke="#000" stroke-width="0.5"/>
    <line x1="9" y1="-3" x2="16" y2="-8" stroke="#0a0a14" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M3 -3 L3 -7 L1 -6 Z" fill="#82b3ff"/>
  </g>

  <!-- RIGHT TANK — cpu, red pennant, smaller (about to eat the shot) -->
  <g transform="translate(47 43)">
    <ellipse cx="6" cy="7" rx="7" ry="0.7" fill="rgba(0,0,0,0.5)"/>
    <rect x="-1" y="4" width="14" height="2.6" rx="0.8" fill="#08080d"/>
    <circle cx="1" cy="5.2" r="0.9" fill="#15172a"/>
    <circle cx="4" cy="5.2" r="0.7" fill="#15172a"/>
    <circle cx="7" cy="5.2" r="0.7" fill="#15172a"/>
    <circle cx="10" cy="5.2" r="0.7" fill="#15172a"/>
    <circle cx="12" cy="5.2" r="0.9" fill="#15172a"/>
    <path d="M-1 4 V1 L1 -1 H10 L12 1 V4 Z" fill="#3a2c2e" stroke="#000" stroke-width="0.4"/>
    <path d="M3 -1 V-3 L4 -4 H8 L9 -3 V-1 Z" fill="#4a3a3a" stroke="#000" stroke-width="0.4"/>
    <line x1="3" y1="-3" x2="-2" y2="-5" stroke="#0a0a14" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M9 -3 L9 -6 L11 -5 Z" fill="#ff8585"/>
  </g>

  <!-- Hot core of impact -->
  <circle cx="52" cy="42" r="3" fill="#fff5c0" opacity="0.92"/>
  <circle cx="52" cy="42" r="1.3" fill="#ffffff"/>
</svg>
