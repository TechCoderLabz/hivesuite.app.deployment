<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <rect x="2" y="2" width="60" height="60" rx="10" fill="#13111c" stroke="#2a2440" stroke-width="2"/>
  
  <!-- subtle grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <path d="M12 2 L12 62 M22 2 L22 62 M32 2 L32 62 M42 2 L42 62 M52 2 L52 62" />
    <path d="M2 12 L62 12 M2 22 L62 22 M2 32 L62 32 M2 42 L62 42 M2 52 L62 52" />
  </g>

  <!-- Player Snake (Purple/Blue) -->
  <g fill="#8b5cf6">
    <circle cx="16" cy="40" r="5" />
    <circle cx="16" cy="30" r="5" />
    <circle cx="24" cy="26" r="5" />
    <circle cx="34" cy="28" r="5" />
  </g>
  <!-- Player Head -->
  <circle cx="44" cy="32" r="6" fill="#a855f7" />
  <!-- Eyes -->
  <circle cx="46" cy="29" r="1.5" fill="#fff" />
  <circle cx="46" cy="35" r="1.5" fill="#fff" />
  <circle cx="46.5" cy="29" r="0.5" fill="#000" />
  <circle cx="46.5" cy="35" r="0.5" fill="#000" />

  <!-- Enemy Worm (Red/Pink) -->
  <g fill="#e11d48">
    <circle cx="46" cy="12" r="4.5" />
    <circle cx="36" cy="12" r="4.5" />
    <circle cx="28" cy="16" r="4.5" />
  </g>
  <!-- Enemy Head -->
  <circle cx="20" cy="20" r="5.5" fill="#f43f5e" />
  <!-- Enemy Eyes -->
  <circle cx="18" cy="18" r="1.2" fill="#fff" />
  <circle cx="18" cy="22" r="1.2" fill="#fff" />
  <circle cx="17.5" cy="18" r="0.6" fill="#000" />
  <circle cx="17.5" cy="22" r="0.6" fill="#000" />
  
  <!-- Glowing Food orbs -->
  <circle cx="52" cy="24" r="2.5" fill="#fde047" />
  <circle cx="52" cy="24" r="4.5" fill="rgba(253,224,71,0.3)" />

  <circle cx="30" cy="44" r="2.5" fill="#67e8f9" />
  <circle cx="30" cy="44" r="4.5" fill="rgba(103,232,249,0.3)" />
</svg>
